# Headless-agent config overlay.
# Loaded via --config on every scheduled omp -p invocation.
# Decouples automated-agent config from interactive sessions:
# interactive toggles advisor via /advisor on/off in config.yml;
# enabled: false keeps automated runs free of advisor output.
advisor:
  enabled: false
  syncBacklog: off
providers:
  webSearchOrder:
    - searxng
searxng:
  endpoint: http://localhost:8080
  categories: general,news
  language: en
