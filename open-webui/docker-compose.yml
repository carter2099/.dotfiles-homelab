services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.11.1
    container_name: open-webui
    restart: unless-stopped
    mem_limit: 4g
    pids_limit: 512
    # Loopback-only: reachable solely via the CF tunnel (cloudflared hits localhost), never the LAN.
    ports:
      - "127.0.0.1:48100:8080"
    # Resolve host.docker.internal → host gateway for host-published services such
    # as opencode-go-proxy on :8082. SearXNG uses the shared Docker network below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env            # WEBUI_SECRET_KEY only; model connections live in webui.db
    environment:
      # Second credential layer behind CF Access (first signup = admin)
      - WEBUI_AUTH=True
      - ENABLE_SIGNUP=False     # no self-registration; admin already created over loopback
      - WEBUI_NAME=Homelab Chat
    volumes:
      - open-webui:/app/backend/data
    networks:
      - default
      - chat-search          # shared with searxng so 'searxng' hostname resolves in-app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  open-webui:

networks:
  chat-search:
    external: true
    name: homelab-chat-search
